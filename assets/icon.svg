<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10182b"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="value" gradientUnits="userSpaceOnUse" x1="142" y1="369" x2="362" y2="136">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- gauge (270deg ring, gap centered at bottom). r=150, C=942.48 -->
  <!-- 270deg track = 706.86 ; 65% value = 459.46 -->
  <g transform="rotate(135 256 256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#23304e" stroke-width="46" stroke-linecap="round" stroke-dasharray="706.86 942.48"/>
    <!-- soft glow under value -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#value)" stroke-width="46" stroke-linecap="round" stroke-dasharray="459.46 942.48" opacity="0.55" filter="url(#glow)"/>
    <!-- value arc -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#value)" stroke-width="46" stroke-linecap="round" stroke-dasharray="459.46 942.48"/>
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="26" fill="#e8edf7"/>
  <circle cx="256" cy="256" r="9" fill="#070b16"/>
</svg>
